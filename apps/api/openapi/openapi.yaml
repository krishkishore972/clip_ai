{
  "openapi": "3.1.0",
  "info": {
    "title": "Video AI API",
    "version": "0.3.0",
    "description": "Authenticated mobile API. Clerk session bearer tokens resolve PostgreSQL users and personal workspaces. Upload routes remain development-only and require DEV_S3_UPLOAD_ENABLED=true for storage. V2 Upload-Token capabilities additionally bind user/workspace ownership; legacy v1 tokens are rejected. Verified completed uploads are persisted with uploaded_unvalidated status. Each create starts a new upload; no create deduplication guarantee. No video bytes are accepted here. Never send authentication headers to S3."
  },
  "security": [{"ClerkSession": []}],
  "paths": {
    "/me": {
      "get": {
        "operationId": "getCurrentUser",
        "description": "Resolve the verified Clerk identity to one persistent application user and personal workspace. Concurrent first requests provision transactionally. No client identity or email-based linking is accepted.",
        "responses": {
          "200": {"description": "Current application identity", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Me"}}}},
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    },
    "/uploads": {
      "post": {
        "operationId": "createMultipartUpload",
        "description": "Starts a fresh S3 multipart upload with a random object key. Returns a signed uploadToken; send it in Upload-Token for subsequent calls. Do not blindly retry after a lost response: each call creates another upload. S3 lifecycle cleanup must remove abandoned multipart uploads.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateUploadRequest"}}}},
        "responses": {
          "201": {"$ref": "#/components/responses/UploadSession"},
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    },
    "/uploads/{uploadId}": {
      "parameters": [{"$ref": "#/components/parameters/UploadId"}, {"$ref": "#/components/parameters/UploadToken"}],
      "get": {
        "operationId": "getMultipartUpload",
        "description": "Authoritative S3 part status or HEAD recovery after completion, restricted to the authenticated capability owner. Completed HEAD recovery also ensures the owned asset is persisted. No per-token revocation or mobile resume guarantee.",
        "responses": {
          "200": {"$ref": "#/components/responses/UploadSession"},
          "default": {"$ref": "#/components/responses/Error"}
        }
      },
      "delete": {
        "operationId": "abortMultipartUpload",
        "description": "Abort an unfinished upload; repeated abort can succeed. Completed objects are never deleted and return 409. Existing signed PUTs cannot be revoked by the API; S3 abort/lifecycle cleanup is required.",
        "responses": {
          "204": {"description": "Aborted; empty response body", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}},
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    },
    "/uploads/{uploadId}/parts/sign": {
      "parameters": [{"$ref": "#/components/parameters/UploadId"}, {"$ref": "#/components/parameters/UploadToken"}],
      "post": {
        "operationId": "signMultipartUploadParts",
        "description": "Refreshable signed UploadPart URLs. Requires Clerk authentication plus an owner-bound Upload-Token. Send raw bytes with PUT and only the returned S3 headers, never Authorization or Upload-Token. Verifies active S3 upload and signed plan. URL lifetime is at most 15 minutes and bounded by token expiration.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SignUploadPartsRequest"}}}},
        "responses": {
          "200": {"description": "Signed parts", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SignedUploadParts"}}}},
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    },
    "/uploads/{uploadId}/complete": {
      "parameters": [{"$ref": "#/components/parameters/UploadId"}, {"$ref": "#/components/parameters/UploadToken"}],
      "post": {
        "operationId": "completeMultipartUpload",
        "description": "Verifies authoritative S3 part numbers, expected sizes and client ETags, sorts parts, completes, and checks final object size/type. A unique object-key HEAD can recover a completed request, but this is not persisted request idempotency. Returns uploaded_unvalidated, never playback permission or AI analysis. Incomplete sets return 409; mismatched parts return 400.",
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CompleteUploadRequest"}}}},
        "responses": {
          "200": {"$ref": "#/components/responses/UploadSession"},
          "default": {"$ref": "#/components/responses/Error"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ClerkSession": {"type": "http", "scheme": "bearer", "bearerFormat": "JWT", "description": "Clerk session token from the configured issuer. Only for Go control endpoints, never S3."}
    },
    "parameters": {
      "UploadToken": {"name": "Upload-Token", "in": "header", "required": true, "description": "V2 HMAC-signed capability binding upload, user/workspace, original filename, storage scope, size/part plan and expiry. Requires Clerk authentication too. Legacy v1 tokens rejected. Never log or put in URLs.", "schema": {"type": "string", "minLength": 1, "maxLength": 4096}},
      "UploadId": {"name": "uploadId", "in": "path", "required": true, "description": "Application upload ID, never an S3 key or client-provided AWS upload ID", "schema": {"$ref": "#/components/schemas/Token"}}
    },
    "responses": {
      "UploadSession": {
        "description": "Upload session; not an accepted/validated media asset",
        "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UploadSession"}}}
      },
      "Error": {
        "description": "401 UNAUTHENTICATED for missing/invalid Clerk session; 400 invalid request; 403 missing/invalid/expired/legacy upload token; 404 upload/object missing or owned by someone else; 409 state conflict; 413 too large; 415 non-JSON; 500 internal; 503 identity, database, or storage unavailable. No sensitive provider data in errors. JSON limit 1 MiB.",
        "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}},
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/APIError"}}}
      }
    },
    "schemas": {
      "Me": {"type": "object", "required": ["userId", "workspaceId"], "properties": {"userId": {"type": "string"}, "workspaceId": {"type": "string"}}},
      "Token": {"type": "string", "minLength": 1, "maxLength": 128, "pattern": "^[A-Za-z0-9_.:-]+$"},
      "PartNumber": {"type": "integer", "minimum": 1, "maximum": 10000},
      "CreateUploadRequest": {
        "type": "object", "additionalProperties": false,
        "required": ["filename", "sizeBytes", "contentType"],
        "properties": {
          "filename": {"type": "string", "minLength": 1, "maxLength": 255, "description": "At most 255 UTF-8 bytes, no control characters or path separators; extension must match contentType (case-insensitive extension). Metadata only, not a storage key."},
          "sizeBytes": {"type": "integer", "format": "int64", "minimum": 1, "maximum": 2000000000},
          "contentType": {"type": "string", "enum": ["video/mp4", "video/quicktime", "video/webm"]}
        }
      },
      "SignUploadPartsRequest": {
        "type": "object", "additionalProperties": false, "required": ["partNumbers"],
        "properties": {"partNumbers": {"type": "array", "minItems": 1, "maxItems": 100, "uniqueItems": true, "items": {"$ref": "#/components/schemas/PartNumber"}}}
      },
      "CompleteUploadPart": {
        "type": "object", "additionalProperties": false, "required": ["partNumber", "eTag"],
        "properties": {
          "partNumber": {"$ref": "#/components/schemas/PartNumber"},
          "eTag": {"type": "string", "minLength": 1, "maxLength": 1024, "description": "Opaque ETag, preserving quotes. At most 1024 UTF-8 bytes, non-whitespace, without control characters. Not a file SHA-256."}
        }
      },
      "CompleteUploadRequest": {
        "type": "object", "additionalProperties": false, "required": ["parts"],
        "properties": {"parts": {"type": "array", "minItems": 1, "maxItems": 10000, "description": "Part numbers must be unique, regardless of ETag", "items": {"$ref": "#/components/schemas/CompleteUploadPart"}}}
      },
      "UploadedPart": {
        "type": "object", "required": ["partNumber", "eTag", "sizeBytes"],
        "properties": {
          "partNumber": {"$ref": "#/components/schemas/PartNumber"},
          "eTag": {"type": "string"},
          "sizeBytes": {"type": "integer", "format": "int64", "minimum": 0}
        }
      },
      "UploadSession": {
        "type": "object", "required": ["uploadId", "uploadToken", "status", "partSizeBytes", "partCount", "expiresAt", "uploadedParts"],
        "properties": {
          "uploadId": {"$ref": "#/components/schemas/Token"},
          "uploadToken": {"type": "string", "minLength": 1, "maxLength": 4096, "description": "Bearer secret; keep with upload context, never log"},
          "status": {"type": "string", "enum": ["uploading", "uploaded_unvalidated"]},
          "partSizeBytes": {"type": "integer", "format": "int64", "minimum": 1},
          "partCount": {"type": "integer", "minimum": 1, "maximum": 10000},
          "expiresAt": {"type": "string", "format": "date-time"},
          "uploadedParts": {"type": ["array", "null"], "items": {"$ref": "#/components/schemas/UploadedPart"}}
        }
      },
      "SignedUploadPart": {
        "type": "object", "required": ["partNumber", "url", "headers", "expiresAt"],
        "properties": {
          "partNumber": {"$ref": "#/components/schemas/PartNumber"},
          "url": {"type": "string", "format": "uri"},
          "headers": {"type": ["object", "null"], "additionalProperties": {"type": "string"}},
          "expiresAt": {"type": "string", "format": "date-time"}
        }
      },
      "SignedUploadParts": {
        "type": "object", "required": ["parts"],
        "properties": {"parts": {"type": "array", "items": {"$ref": "#/components/schemas/SignedUploadPart"}}}
      },
      "APIError": {
        "type": "object", "required": ["code", "message"],
        "properties": {
          "code": {"type": "string"}, "message": {"type": "string"},
          "details": {}, "traceId": {"type": "string"}
        }
      }
    }
  }
}

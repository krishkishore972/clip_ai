{
  "openapi": "3.1.0",
  "info": {
    "title": "Video AI API",
    "version": "0.8.0",
    "description": "Authenticated personal-only mobile API. Clerk session bearer tokens resolve PostgreSQL users; assets belong directly to users. Upload routes remain development-only and require DEV_S3_UPLOAD_ENABLED=true for storage. V3 Upload-Token capabilities additionally bind user ownership; legacy v1/v2 tokens are rejected. Verified completed uploads are persisted with uploaded_unvalidated status. Each create starts a new upload; no create deduplication guarantee. No video bytes are accepted here. Never send authentication headers to S3."
  },
  "security": [{ "ClerkSession": [] }],
  "paths": {
    "/internal/curate": {
      "post": {
        "operationId": "curateTranscript",
        "servers": [
          {
            "url": "http://127.0.0.1:8090",
            "description": "Private LLM service, not the Go API; use private TLS across hosts."
          }
        ],
        "security": [{ "LLMServiceBearer": [] }],
        "description": "Server-to-server curation, enabled by default. Startup requires Groq credentials and a private service token, never a Clerk token. Explicit CURATION_ENABLED=false selects health-only operation and this route returns 503. One active request per process, otherwise 503 BUSY. Authenticate before parsing; application/json only, no compressed bodies, 1 MiB body cap. Complete serialized prompt messages are capped at 100,000 UTF-8 bytes; no truncation/chunking. Overall deadline 65 seconds, at most two 30-second SDK attempts. All responses are no-store. Transcript text is untrusted data. No persistence, ownership authorization, media rendering or acceptance occurs here; Go must authorize ownership before calling and validate returned ranges against the source. Runtime also enforces contiguous zero-based indexes, nonblank text, ordered starts, positive word intervals, ordered duration constraints, requested candidate count, range/duration/source-start checks and duplicate rejection. Overlap is allowed; fewer or no candidates may be returned. Decoded content cap 32 KiB is not a transport-body cap.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": ["transcriptHash", "words", "constraints"],
                "properties": {
                  "transcriptHash": {
                    "type": "string",
                    "pattern": "^sha256:[a-f0-9]{64}$"
                  },
                  "words": {
                    "type": "array",
                    "minItems": 1,
                    "maxItems": 12000,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["index", "text", "startMs", "endMs"],
                      "properties": {
                        "index": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 9007199254740991
                        },
                        "text": {
                          "type": "string",
                          "minLength": 1,
                          "description": "Nonblank; at most 512 UTF-8 bytes, enforced at runtime without rewriting text.",
                          "x-maxUtf8Bytes": 512
                        },
                        "startMs": {
                          "type": "integer",
                          "minimum": -9007199254740991,
                          "maximum": 9007199254740991,
                          "description": "Already source-aligned; may be negative. Negative-start candidate ranges are rejected."
                        },
                        "endMs": {
                          "type": "integer",
                          "minimum": -9007199254740991,
                          "maximum": 9007199254740991
                        }
                      }
                    }
                  },
                  "constraints": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "candidateCount",
                      "minDurationMs",
                      "maxDurationMs"
                    ],
                    "properties": {
                      "candidateCount": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 5
                      },
                      "minDurationMs": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 60000
                      },
                      "maxDurationMs": {
                        "type": "integer",
                        "minimum": 1,
                        "maximum": 60000
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Validated proposals only, not captioned previews or accepted clips.",
            "headers": {
              "Cache-Control": {
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["candidates"],
                  "properties": {
                    "candidates": {
                      "type": "array",
                      "maxItems": 5,
                      "items": {
                        "type": "object",
                        "additionalProperties": false,
                        "required": [
                          "startWordIndex",
                          "endWordIndexExclusive",
                          "title",
                          "hook",
                          "reason"
                        ],
                        "properties": {
                          "startWordIndex": {
                            "type": "integer",
                            "minimum": 0,
                            "maximum": 9007199254740991
                          },
                          "endWordIndexExclusive": {
                            "type": "integer",
                            "minimum": 1,
                            "maximum": 9007199254740991
                          },
                          "title": {
                            "type": "string",
                            "minLength": 1,
                            "description": "Nonblank; at most 1000 JavaScript UTF-16 code units.",
                            "x-maxUtf16CodeUnits": 1000
                          },
                          "hook": {
                            "type": "string",
                            "minLength": 1,
                            "description": "Nonblank; at most 1000 JavaScript UTF-16 code units.",
                            "x-maxUtf16CodeUnits": 1000
                          },
                          "reason": {
                            "type": "string",
                            "minLength": 1,
                            "description": "Nonblank; at most 1000 JavaScript UTF-16 code units.",
                            "x-maxUtf16CodeUnits": 1000
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/LLMCurationError" },
          "401": { "$ref": "#/components/responses/LLMCurationError" },
          "413": { "$ref": "#/components/responses/LLMCurationError" },
          "415": { "$ref": "#/components/responses/LLMCurationError" },
          "500": { "$ref": "#/components/responses/LLMCurationError" },
          "502": { "$ref": "#/components/responses/LLMCurationError" },
          "503": { "$ref": "#/components/responses/LLMCurationError" },
          "504": { "$ref": "#/components/responses/LLMCurationError" }
        }
      }
    },
    "/me": {
      "get": {
        "operationId": "getCurrentUser",
        "description": "Resolve the verified Clerk identity to one persistent application user. Concurrent first requests converge through a unique issuer/subject constraint and atomic upsert. No client identity or email-based linking is accepted.",
        "responses": {
          "200": {
            "description": "Current application identity",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Me" }
              }
            }
          },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/media/{assetId}/status": {
      "get": {
        "operationId": "getMediaValidationStatus",
        "description": "Read the authenticated user's persisted media validation status. Requires a Clerk bearer token only, not Upload-Token. The asset ID is the uploadId returned by upload completion. Missing, cross-user and NULL-owned legacy assets all return 404. This endpoint is independent of the development S3 upload opt-in and performs no S3, queue, signing, retry or media-processing work. Ready means metadata validation passed, not playback permission or clip availability. Never returns filenames, owner IDs, storage locations, claim data or raw probe metadata.",
        "parameters": [
          {
            "name": "assetId",
            "in": "path",
            "required": true,
            "schema": { "$ref": "#/components/schemas/Token" }
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted validation state for the owned asset",
            "headers": {
              "Cache-Control": {
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MediaAssetStatus"
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/media/{assetId}/preparation": {
      "parameters": [
        {
          "name": "assetId",
          "in": "path",
          "required": true,
          "schema": { "$ref": "#/components/schemas/Token" }
        }
      ],
      "get": {
        "operationId": "getMediaPreparation",
        "description": "Read the authenticated owner's preparation status without enqueueing work. Preparation is separate from validation. Missing, cross-user and NULL-owned assets return identical 404. No storage locations, claim identifiers or URLs are returned. Every response is no-store.",
        "responses": {
          "200": {
            "description": "Owned preparation status",
            "headers": {
              "Cache-Control": {
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MediaPreparationStatus"
                }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" },
          "default": { "$ref": "#/components/responses/Error" }
        }
      },
      "post": {
        "operationId": "ensureMediaPreparation",
        "description": "Owner-authorized idempotent preparation for an older validation-ready upload without a preparation record. Accepts no body or Upload-Token. Requires MEDIA_PREPARATION_ENABLED. The combined media-processing worker consumes the resulting event. Existing pending, preparing, ready or failed records are returned unchanged; this operation never resets attempts or retries a terminal record. Every response is no-store.",
        "responses": {
          "202": {
            "description": "Current preparation record, newly created or existing",
            "headers": {
              "Cache-Control": {
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MediaPreparationStatus"
                }
              }
            }
          },
          "400": { "$ref": "#/components/responses/Error" },
          "401": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/uploads": {
      "post": {
        "operationId": "createMultipartUpload",
        "description": "Starts a fresh S3 multipart upload with a random object key. Returns a signed uploadToken; send it in Upload-Token for subsequent calls. Do not blindly retry after a lost response: each call creates another upload. S3 lifecycle cleanup must remove abandoned multipart uploads.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateUploadRequest"
              }
            }
          }
        },
        "responses": {
          "201": { "$ref": "#/components/responses/UploadSession" },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/uploads/{uploadId}": {
      "parameters": [
        { "$ref": "#/components/parameters/UploadId" },
        { "$ref": "#/components/parameters/UploadToken" }
      ],
      "get": {
        "operationId": "getMultipartUpload",
        "description": "Authoritative S3 part status or HEAD recovery after completion, restricted to the authenticated capability owner. Completed HEAD recovery also ensures the owned asset is persisted. No per-token revocation or mobile resume guarantee.",
        "responses": {
          "200": { "$ref": "#/components/responses/UploadSession" },
          "default": { "$ref": "#/components/responses/Error" }
        }
      },
      "delete": {
        "operationId": "abortMultipartUpload",
        "description": "Abort an unfinished upload; repeated abort can succeed. Completed objects are never deleted and return 409. Existing signed PUTs cannot be revoked by the API; S3 abort/lifecycle cleanup is required.",
        "responses": {
          "204": {
            "description": "Aborted; empty response body",
            "headers": {
              "Cache-Control": {
                "schema": { "type": "string", "const": "no-store" }
              }
            }
          },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/uploads/{uploadId}/parts/sign": {
      "parameters": [
        { "$ref": "#/components/parameters/UploadId" },
        { "$ref": "#/components/parameters/UploadToken" }
      ],
      "post": {
        "operationId": "signMultipartUploadParts",
        "description": "Refreshable signed UploadPart URLs. Requires Clerk authentication plus an owner-bound Upload-Token. Send raw bytes with PUT and only the returned S3 headers, never Authorization or Upload-Token. Verifies active S3 upload and signed plan. URL lifetime is at most 15 minutes and bounded by token expiration.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SignUploadPartsRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Signed parts",
            "headers": {
              "Cache-Control": {
                "schema": { "type": "string", "const": "no-store" }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SignedUploadParts"
                }
              }
            }
          },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/uploads/{uploadId}/complete": {
      "parameters": [
        { "$ref": "#/components/parameters/UploadId" },
        { "$ref": "#/components/parameters/UploadToken" }
      ],
      "post": {
        "operationId": "completeMultipartUpload",
        "description": "Verifies authoritative S3 part numbers, expected sizes and client ETags, sorts parts, completes, and checks final object size/type. A unique object-key HEAD can recover a completed request, but this is not persisted request idempotency. Returns uploaded_unvalidated, never playback permission or AI analysis. Incomplete sets return 409; mismatched parts return 400.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CompleteUploadRequest"
              }
            }
          }
        },
        "responses": {
          "200": { "$ref": "#/components/responses/UploadSession" },
          "default": { "$ref": "#/components/responses/Error" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "LLMServiceBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Private CURATION_SERVICE_TOKEN: 32–256 base64url characters. Server-to-server only; not a Clerk identity and never exposed to clients. No Go endpoint accepts this scheme."
      },
      "ClerkSession": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Clerk session token from the configured issuer. Only for Go control endpoints, never S3."
      }
    },
    "parameters": {
      "UploadToken": {
        "name": "Upload-Token",
        "in": "header",
        "required": true,
        "description": "V3 HMAC-signed capability binding upload, user, original filename, storage scope, size/part plan and expiry. Requires Clerk authentication too. Legacy v1/v2 tokens rejected. Never log or put in URLs.",
        "schema": { "type": "string", "minLength": 1, "maxLength": 4096 }
      },
      "UploadId": {
        "name": "uploadId",
        "in": "path",
        "required": true,
        "description": "Application upload ID, never an S3 key or client-provided AWS upload ID",
        "schema": { "$ref": "#/components/schemas/Token" }
      }
    },
    "responses": {
      "LLMCurationError": {
        "description": "Sanitized LLM service error. 400 INVALID_INPUT/INVALID_JSON; 401 UNAUTHENTICATED; 413 BODY_TOO_LARGE/PROMPT_TOO_LARGE; 415 UNSUPPORTED_MEDIA_TYPE; 500 INTERNAL_ERROR; 502 PROVIDER_FAILED/INVALID_RESPONSE; 503 BUSY/SERVICE_UNAVAILABLE/CONFIGURATION/CANCELLED; 504 TIMEOUT. BUSY includes Retry-After: 1.",
        "headers": {
          "Cache-Control": {
            "schema": { "type": "string", "const": "no-store" }
          }
        },
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/APIError" }
          }
        }
      },
      "UploadSession": {
        "description": "Upload session; not an accepted/validated media asset",
        "headers": {
          "Cache-Control": {
            "schema": { "type": "string", "const": "no-store" }
          }
        },
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/UploadSession" }
          }
        }
      },
      "Error": {
        "description": "401 UNAUTHENTICATED for missing/invalid Clerk session; 400 invalid request; 403 missing/invalid/expired/legacy upload token; 404 upload/object missing or owned by someone else; 409 state conflict; 413 too large; 415 non-JSON; 500 internal; 503 identity, database, or storage unavailable. No sensitive provider data in errors. JSON limit 1 MiB.",
        "headers": {
          "Cache-Control": {
            "schema": { "type": "string", "const": "no-store" }
          }
        },
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/APIError" }
          }
        }
      }
    },
    "schemas": {
      "MediaPreparationState": {
        "type": "string",
        "enum": ["not_prepared", "pending", "preparing", "ready", "failed"]
      },
      "MediaPreparationStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "assetId",
          "status",
          "attempts",
          "failureCode",
          "updatedAt",
          "preparedAt"
        ],
        "properties": {
          "assetId": { "$ref": "#/components/schemas/Token" },
          "status": { "$ref": "#/components/schemas/MediaPreparationState" },
          "attempts": { "type": "integer", "minimum": 0, "maximum": 2 },
          "failureCode": {
            "type": ["string", "null"],
            "pattern": "^[A-Z][A-Z0-9_]{0,63}$",
            "description": "Allowlisted safe preparation code, or null. Unknown stored text is replaced by PREPARATION_FAILED. Ready has null."
          },
          "updatedAt": { "type": "string", "format": "date-time" },
          "preparedAt": { "type": ["string", "null"], "format": "date-time" }
        }
      },
      "Me": {
        "type": "object",
        "additionalProperties": false,
        "required": ["userId"],
        "properties": { "userId": { "type": "string", "minLength": 1 } }
      },
      "MediaValidationState": {
        "type": "string",
        "enum": [
          "uploaded_unvalidated",
          "validating",
          "ready",
          "rejected",
          "validation_failed"
        ]
      },
      "MediaAssetStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "assetId",
          "status",
          "attempts",
          "maxAttempts",
          "failureCode",
          "updatedAt",
          "validatedAt"
        ],
        "properties": {
          "assetId": { "$ref": "#/components/schemas/Token" },
          "status": { "$ref": "#/components/schemas/MediaValidationState" },
          "attempts": {
            "type": "integer",
            "minimum": 0,
            "maximum": 4,
            "description": "Durable claimed validation attempts, including interrupted attempts; not dispatcher delivery attempts. Historical rows may exceed maxAttempts because the field ceiling is retained for backward compatibility."
          },
          "maxAttempts": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2,
            "description": "Active durable attempt budget for the combined validation/preparation worker. Use this value, not the historical attempts ceiling, when presenting progress or remaining retries."
          },
          "failureCode": {
            "type": ["string", "null"],
            "pattern": "^[A-Z][A-Z0-9_]{0,63}$",
            "description": "Allowlisted safe validation/retry code, or null. Unknown internal codes are replaced with VALIDATION_FAILED; raw dependency errors are never returned. Ready always has null."
          },
          "updatedAt": { "type": "string", "format": "date-time" },
          "validatedAt": {
            "type": ["string", "null"],
            "format": "date-time",
            "description": "Timestamp of successful validation, or null."
          }
        }
      },
      "Token": {
        "type": "string",
        "minLength": 1,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9_.:-]+$"
      },
      "PartNumber": { "type": "integer", "minimum": 1, "maximum": 10000 },
      "CreateUploadRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["filename", "sizeBytes", "contentType"],
        "properties": {
          "filename": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255,
            "description": "At most 255 UTF-8 bytes, no control characters or path separators; extension must match contentType (case-insensitive extension). Metadata only, not a storage key."
          },
          "sizeBytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 2000000000
          },
          "contentType": {
            "type": "string",
            "enum": ["video/mp4", "video/quicktime", "video/webm"]
          }
        }
      },
      "SignUploadPartsRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["partNumbers"],
        "properties": {
          "partNumbers": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "uniqueItems": true,
            "items": { "$ref": "#/components/schemas/PartNumber" }
          }
        }
      },
      "CompleteUploadPart": {
        "type": "object",
        "additionalProperties": false,
        "required": ["partNumber", "eTag"],
        "properties": {
          "partNumber": { "$ref": "#/components/schemas/PartNumber" },
          "eTag": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1024,
            "description": "Opaque ETag, preserving quotes. At most 1024 UTF-8 bytes, non-whitespace, without control characters. Not a file SHA-256."
          }
        }
      },
      "CompleteUploadRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["parts"],
        "properties": {
          "parts": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10000,
            "description": "Part numbers must be unique, regardless of ETag",
            "items": { "$ref": "#/components/schemas/CompleteUploadPart" }
          }
        }
      },
      "UploadedPart": {
        "type": "object",
        "required": ["partNumber", "eTag", "sizeBytes"],
        "properties": {
          "partNumber": { "$ref": "#/components/schemas/PartNumber" },
          "eTag": { "type": "string" },
          "sizeBytes": { "type": "integer", "format": "int64", "minimum": 0 }
        }
      },
      "UploadSession": {
        "type": "object",
        "required": [
          "uploadId",
          "uploadToken",
          "status",
          "partSizeBytes",
          "partCount",
          "expiresAt",
          "uploadedParts"
        ],
        "properties": {
          "uploadId": { "$ref": "#/components/schemas/Token" },
          "uploadToken": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096,
            "description": "Bearer secret; keep with upload context, never log"
          },
          "status": {
            "type": "string",
            "enum": ["uploading", "uploaded_unvalidated"]
          },
          "partSizeBytes": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "partCount": { "type": "integer", "minimum": 1, "maximum": 10000 },
          "expiresAt": { "type": "string", "format": "date-time" },
          "uploadedParts": {
            "type": ["array", "null"],
            "items": { "$ref": "#/components/schemas/UploadedPart" }
          }
        }
      },
      "SignedUploadPart": {
        "type": "object",
        "required": ["partNumber", "url", "headers", "expiresAt"],
        "properties": {
          "partNumber": { "$ref": "#/components/schemas/PartNumber" },
          "url": { "type": "string", "format": "uri" },
          "headers": {
            "type": ["object", "null"],
            "additionalProperties": { "type": "string" }
          },
          "expiresAt": { "type": "string", "format": "date-time" }
        }
      },
      "SignedUploadParts": {
        "type": "object",
        "required": ["parts"],
        "properties": {
          "parts": {
            "type": "array",
            "items": { "$ref": "#/components/schemas/SignedUploadPart" }
          }
        }
      },
      "APIError": {
        "type": "object",
        "required": ["code", "message"],
        "properties": {
          "code": { "type": "string" },
          "message": { "type": "string" },
          "details": {},
          "traceId": { "type": "string" }
        }
      }
    }
  }
}
